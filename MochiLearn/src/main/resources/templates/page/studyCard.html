<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>학습 카드 상세</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/studyCard.css}"/>
    <link rel="stylesheet" th:href="@{/css/word-selector.css}">
    <link rel="stylesheet" th:href="@{/css/speech-practice.css}">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp.min.css" />

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script th:src="@{/js/word-selection.js}"></script>
    <script th:src="@{/js/speech-practice.js}"></script>
    <script th:src="@{/js/studyCard.js}"></script>
    <script th:src="@{/js/wordbook-popup.js}"></script>

</head>
<body>
<div th:replace="~{navigation::navigation}"></div>
<main>
    <div class="main-grid">
        <!-- 왼쪽 공간 - 제목, 영상, 자막, 태그 등 -->
        <div class="left-column">
            <!-- 제목 공간 -->
            <div class="card title">
			    <div class="header-content"> 
			        <div class="title-container">
			            <h1 id="cardTitle"></h1>
			        </div>
			        <div th:if="${canEdit}" class="delete-wrap">
			            <button id="delete-button" class="delete-button">❌</button>
			        </div>
			    </div>
			    
			    <div id="tags-container" class="tags">
			        <div class="tag-item"></div>
			    </div>
			    <div class="like-container">
			        <span id="cardLike"></span>
			        <!--<button id="like-button" class="like-button">1</button>-->
                    <svg id="like-button" class="like-button" viewBox="0 0 128 128"
                         xmlns="http://www.w3.org/2000/svg" role="img">

                        <g class="star-parts">

                            <path id="main-body"
                                  d="M68.05 7.23l13.46 30.7a7.047 7.047 0 0 0 5.82 4.19l32.79 2.94c3.71.54 5.19 5.09 2.5 7.71l-24.7 20.75c-2 1.68-2.91 4.32-2.36 6.87l7.18 33.61c.63 3.69-3.24 6.51-6.56 4.76L67.56 102a7.033 7.033 0 0 0-7.12 0l-28.62 16.75c-3.31 1.74-7.19-1.07-6.56-4.76l7.18-33.61c.54-2.55-.36-5.19-2.36-6.87L5.37 52.78c-2.68-2.61-1.2-7.17 2.5-7.71l32.79-2.94a7.047 7.047 0 0 0 5.82-4.19l13.46-30.7c1.67-3.36 6.45-3.36 8.11-.01z"
                                  fill="#ababab"></path>

                            <path id="top-highlight"
                                  d="M67.07 39.77l-2.28-22.62c-.09-1.26-.35-3.42 1.67-3.42c1.6 0 2.47 3.33 2.47 3.33l6.84 18.16c2.58 6.91 1.52 9.28-.97 10.68c-2.86 1.6-7.08.35-7.73-6.13z"
                                  fill="#c7c7c7"></path>

                            <path id="right-highlight"
                                  d="M95.28 71.51L114.9 56.2c.97-.81 2.72-2.1 1.32-3.57c-1.11-1.16-4.11.51-4.11.51l-17.17 6.71c-5.12 1.77-8.52 4.39-8.82 7.69c-.39 4.4 3.56 7.79 9.16 3.97z"
                                  fill="#828282"></path>

                        </g>
                    </svg>
			    </div>

			</div>
            <!-- 유튜브 영상 로드 공간 -->
            <div id="player-container" class="player-container">
                <div id="player"></div>
            </div>
            <!-- 자막 공간 -->
            
            <div id="transcript-container" class="card transcript-container">

                <div class="transcript-header">
                    <button id="prev-btn" class="transcript-nav-btn">◀</button>
                    <div class="transcript-text">
                        <p id="japanese-line" class="jp">자막이 여기에 표시됩니다.</p>
                        <p id="korean-line" class="kr">구간을 선택해주세요.</p>
                    </div>
                    <button id="next-btn" class="transcript-nav-btn">▶</button>
                </div>
                <div id="transcript-index"></div>
                <div class="buttonContainer">
                <!-- js/css로 현재 언어에 맞게 하이라이트를 주기 -->
                <button id="langChange"><strong>한 + 日</strong></button>
            </div>
            </div>


            <!-- 임시 말하기 기능 공간 -->
            <div class="card">

                <!-- 스크립트 재생 버튼 -->
                <div class="btn-container">
                    <button id="playScriptBtn" class="play-script-btn" title="자막 재생">▶</button>
                </div>

                <div class="practice-comment" id="practiceComment">
                    듣고 따라해보세요!
                </div>

                <!-- 마이크 녹음 버튼 UI -->
                <div class="mic-wrap" id="micWrap">
                    <button id="micBtn" class="mic-btn" aria-pressed="false" title="녹음 시작/중지">
                        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M19 10V12C19 15.866 15.866 19 12 19M5 10V12C5 15.866 8.13401 19 12 19M12 19V22M8 22H16M12 15C10.3431 15 9 13.6569 9 12V5C9 3.34315 10.3431 2 12 2C13.6569 2 15 3.34315 15 5V12C15 13.6569 13.6569 15 12 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <div class="status-dot" id="statusDot"></div>
                    </button>
                </div>

                <div class="hint" id="hint"></div>

                <!-- 점수 표시 영역 -->
                <div class="score-container hidden" id="scoreContainer">
                    <div class="score-box accuracy">
                        <div class="score-title">정확도</div>
                        <div class="score-value" id="accuracyScore">--</div>
                        <div class="score-bar-wrap">
                            <div class="score-bar" id="accuracyBar"></div>
                        </div>
                    </div>
                    <div class="score-box fluency">
                        <div class="score-title">유창성</div>
                        <div class="score-value" id="fluencyScore">--</div>
                        <div class="score-bar-wrap">
                            <div class="score-bar" id="fluencyBar"></div>
                        </div>
                    </div>
                </div>

                <!-- 상세 피드백 영역 -->
                <div class="feedback-message-container" id="feedbackMessageContainer">
                    <h4>발음 피드백</h4>
                    <div id="feedbackMessage"></div>
                </div>
            </div>

            
        </div>

        <!-- 우측 공간 - 구간 추가 관련 -->
        <div class="right-column sticky">
            <div class="card">
                <div class="timeline-header">
                    <h3 class="card-title">학습 구간 목록</h3>
                    <span id="selected-section-display"></span>
                </div>
                <div id="timeline-buttons-container">
                    <!-- 섹션 버튼 생성 위치 -->
                </div>
            </div>
        </div>

    </div>
    <!-- 커스텀 모달 UI -->
    <div id="customModal" class="modal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <div class="modal-buttons">
                <button id="modalConfirmBtn" class="modal-btn confirm" style="display: none;">확인</button>
                <button id="modalCancelBtn" class="modal-btn cancel" style="display: none;">취소</button>
                <button id="modalCloseBtn" class="modal-btn confirm" style="display: none;">닫기</button>
            </div>
        </div>
    </div>
</main>
<!-- 단어 팝업 관련 div -->
<div class="wordSelector"></div>
<div class="wordbookSelector"></div>
</body>
</html>
