<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>학습 카드 상세</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/studyCard.css}"/>
    <link rel="stylesheet" th:href="@{/css/word-selector.css}">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

<!--    <script th:src="@{/js/studyCard.js}"></script> -->

    <script th:src="@{/js/youtube-player.js}"></script>
    <script th:src="@{/js/transcript-manager.js}"></script>
    <script th:src="@{/js/word-selection.js}"></script>
    <script th:src="@{/js/speech-practice.js}"></script>
    <script th:src="@{/js/study-card.js}"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        //에러 무시해도 됩니다.
        var wordPageUrl = [[@{/page/word}]];
        window.onload = function() {
            console.log("Navigation script loaded");
            const wordPageBtn = document.getElementById("wordPageBtn");
            wordPageBtn.onclick = function() {
                wordPage();
            };
        };
        function wordPage() {
            window.open(wordPageUrl, "_blank", "toolbar=yes,scrollbars=yes,resizable=yes,top=100,left=500,width=700,height=400");
        }
        /*]]>*/
    </script>
</head>
<body>
<div th:replace="~{navigation::navigation}"></div>
<main>
    <div class="main-grid">
        <!-- 왼쪽 공간 - 제목, 영상, 자막, 태그 등 -->
        <div class="left-column">
            <!-- 제목 공간 -->
            <div class="card title">
                <h1 id="cardTitle"></h1>
                <button id="like-button" class="like-button">좋아용</button>
                <h1 id="cardLike"></h1>

            </div>
            <!-- 태그 공간 (지금은 더미데이터입니다) -->
            <div class="tags card">
                <div class="tag-item"></div>
            </div>
            <!-- 유튜브 영상 로드 공간 -->
            <div id="player-container" class="player-container">
                <div id="player"></div>
            </div>
            <!-- 자막 공간 -->
            <div class="buttonContainer">
                <!-- js/css로 현재 언어에 맞게 하이라이트를 주기 -->
                <button id="langChange"><strong>한 + 일</strong></button>
            </div>
            <div id="transcript-container" class="card transcript-container">

                <div class="transcript-header">
                    <button id="prev-btn" class="transcript-nav-btn">◀</button>
                    <div class="transcript-text">
                        <p id="japanese-line" class="jp">자막이 여기에 표시됩니다.</p>
                        <p id="korean-line" class="kr">구간을 선택해주세요.</p>
                    </div>
                    <button id="next-btn" class="transcript-nav-btn">▶</button>
                </div>
                <div id="transcript-index"></div>
            </div>


            <!-- 임시 말하기 기능 공간 -->
            <div class="card">
                <input type="button" value="시작" id="startButton">
                <input type="button" value="정지" id="stopButton">
            </div>

            <!-- 삭제/수정 임시 위치 -->
            <div class="card">
                <button id="delete-button" class="delete-button">삭제하기</button>
                <button id="edit-button" class="edit-button">수정하기</button>
            </div>
        </div>

        <!-- 우측 공간 - 구간 추가 관련 -->
        <div class="right-column sticky">
            <div class="card">
                <div class="timeline-header">
                    <h3 class="card-title">학습 구간 목록</h3>
                    <span id="selected-section-display"></span>
                </div>
                <div id="timeline-buttons-container">
                    <!-- 섹션 버튼 생성 위치 -->
                </div>
            </div>
        </div>

    </div>
</main>
<!-- 단어 팝업 관련 div -->
<div class="wordSelector"></div>
<div class="wordbookSelector"></div>
</body>
</html>
