<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>학습 카드 상세</title>
<link rel="stylesheet" th:href="@{/css/nav.css}" />
<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/write.css}">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<div th:replace="~{navigation::navigation}"></div>
<main>
<h1 id="cardTitle"></h1>
<h1 id="cardLike"></h1>
	<div class="card">
        <div class="timeline-header">
            <h3 class="card-title">학습 구간 목록</h3>
            <span id="selected-section-display"></span>
        </div>
	        <div id="timeline-buttons-container">
	            <!-- 학습 구간 추가시 이곳에 버튼이 생성됩니다 -->
	        </div>
        </div>
            <div id="player-container" class="player-container">
                <div id="player"></div>
            </div>
      
</main>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
function renderCard(card) {
    document.getElementById('cardTitle').innerText = card.title;
    document.getElementById('cardLike').innerText = card.like;
    
}
 
 	// DOMContentLoaded 이벤트 리스너를 사용해 페이지 로드 시 바로 실행합니다.
     $(document).ready(function() {
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('cardId');

        if (cardId) {
            $.get(`/mochilearn/api/study/card?cardId=${cardId}`)
                .done(function(cardData) {
                    console.log("✅ 데이터 수신 성공:", cardData);
                    renderCard(cardData);
                })
                .fail(function(jqXHR, textStatus, errorThrown) {
                    console.error("❌ 데이터 요청 실패:", textStatus, errorThrown);
                });
        }
    });
</script>
</body>
</html>
