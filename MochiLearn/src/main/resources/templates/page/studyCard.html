<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>학습 카드 상세</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/studyCard.css}"/>
    <link rel="stylesheet" th:href="@{/css/word-selector.css}">
    <link rel="stylesheet" th:href="@{/css/speech-practice.css}">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

<!--    <script th:src="@{/js/studyCard.js}"></script> -->

    <script th:src="@{/js/word-selection.js}"></script>
    <script th:src="@{/js/speech-practice.js}"></script>
    <script th:src="@{/js/studyCard.js}"></script>
    <script th:src="@{/js/wordbook-popup.js}"></script>

</head>
<body>
<div th:replace="~{navigation::navigation}"></div>
<main>
    <div class="main-grid">
        <!-- 왼쪽 공간 - 제목, 영상, 자막, 태그 등 -->
        <div class="left-column">
            <!-- 제목 공간 -->
            <div class="card title">
                <div class="title-container">
                    <h1 id="cardTitle"></h1>
                </div>
                <div class="like-container">
                    <button id="like-button" class="like-button">★</button>
                    <span id="cardLike"></span>
                </div>
            </div>
            <!-- 태그 공간 (지금은 더미데이터입니다) -->
            <div class="tags card">
                <div class="tag-item"></div>
            </div>
            <!-- 유튜브 영상 로드 공간 -->
            <div id="player-container" class="player-container">
                <div id="player"></div>
            </div>
            <!-- 자막 공간 -->
            <div class="buttonContainer">
                <!-- js/css로 현재 언어에 맞게 하이라이트를 주기 -->
                <button id="langChange"><strong>한 + 日</strong></button>
            </div>
            <div id="transcript-container" class="card transcript-container">

                <div class="transcript-header">
                    <button id="prev-btn" class="transcript-nav-btn">◀</button>
                    <div class="transcript-text">
                        <p id="japanese-line" class="jp">자막이 여기에 표시됩니다.</p>
                        <p id="korean-line" class="kr">구간을 선택해주세요.</p>
                    </div>
                    <button id="next-btn" class="transcript-nav-btn">▶</button>
                </div>
                <div id="transcript-index"></div>
            </div>


            <!-- 임시 말하기 기능 공간 -->
            <div class="card">
                <!--<input type="button" value="시작" id="startButton">
                <input type="button" value="정지" id="stopButton">-->
                <div class="mic-wrap" id="micWrap">
                    <button id="micBtn" class="mic-btn" aria-pressed="false" title="녹음 시작/중지">
                        <!-- SVG 마이크 아이콘 -->
                        <!--?xml version="1.0" encoding="utf-8"?--><!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools -->
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M19 10V12C19 15.866 15.866 19 12 19M5 10V12C5 15.866 8.13401 19 12 19M12 19V22M8 22H16M12 15C10.3431 15 9 13.6569 9 12V5C9 3.34315 10.3431 2 12 2C13.6569 2 15 3.34315 15 5V12C15 13.6569 13.6569 15 12 15Z" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <div class="status-dot" id="statusDot"></div>
                    </button>
                </div>
                <div class="hint" id="hint"></div>
            </div>

            <!-- 삭제/수정 임시 위치 -->
            <div class="card">
                <div th:if="${canEdit}">
			        <button id="delete-button" class="delete-button">삭제하기</button>
			        <button id="edit-button" class="edit-button">수정하기</button>
			    </div>
            </div>
        </div>

        <!-- 우측 공간 - 구간 추가 관련 -->
        <div class="right-column sticky">
            <div class="card">
                <div class="timeline-header">
                    <h3 class="card-title">학습 구간 목록</h3>
                    <span id="selected-section-display"></span>
                </div>
                <div id="timeline-buttons-container">
                    <!-- 섹션 버튼 생성 위치 -->
                </div>
            </div>
        </div>

    </div>
</main>
<!-- 단어 팝업 관련 div -->
<div class="wordSelector"></div>
<div class="wordbookSelector"></div>
</body>
</html>
