<!DOCTYPE html>
<html lang="en" xmlns:th="thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>학습 카드 상세</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">

    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <style>
        body {
            max-width: 800px;
            margin: 40px auto;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }
        .card-detail {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
        }
        .card-detail img {
            max-width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .card-detail h1 {
            font-size: 1.8em;
            margin-bottom: 12px;
            color: #333;
        }
        .card-detail p {
            font-size: 1.1em;
            color: #555;
            line-height: 1.4;
        }
        .back-btn {
            display: inline-block;
            margin-top: 24px;
            padding: 10px 18px;
            text-decoration: none;
            background-color: #4a90e2;
            color: white;
            border-radius: 6px;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>
    <div th:replace="~{navigation::navigation}"></div>

    <div class="card-detail" th:if="${card}">
        <!-- 썸네일 이미지 -->
        <img th:src="${card.url != null} ? ${card.url} : @{/images/default-thumbnail.png}" alt="카드 이미지" />

        <!-- 카드 제목 -->
        <h1 th:text="${card.title}">카드 제목</h1>

        <!-- 뒤로 가기 버튼 -->
        <a href="/study" class="back-btn">목록으로 돌아가기</a>
    </div>

    
</body>
</html>
