<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>학습 카드 상세</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/studyCard.css}"/>
</head>
<body>
    <div th:replace="~{navigation::navigation}"></div>
    <main>
        <div class="main-grid">
            <!-- 왼쪽 공간 - 제목, 영상, 자막, 태그 등 -->
            <div class="left-column">
                <!-- 제목 공간 -->
                <div class="card title">
                    <h1 id="cardTitle">제목</h1>
                    <button id="like-button" class="like-button">좋아용</button>
                    <h1 id="cardLike">좋아요</h1>

                </div>
                <!-- 태그 공간 (지금은 더미데이터입니다) -->
                <div class="tags card">
                    <div class="tag-item">중급</div>
                    <div class="tag-item">애니</div>
                    <div class="tag-item">일상회화</div>
                </div>
                <!-- 유튜브 영상 로드 공간 -->
                <div id="player-container" class="player-container">
                    <div id="player"></div>
                </div>
                <!-- 자막 공간 -->
                <div class="buttonContainer">
                    <!-- js/css로 현재 언어에 맞게 하이라이트를 주기 -->
                    <button id="langChange"><strong>한 + 일</strong></button>
                </div>
                <div id="transcript-container" class="card transcript-container">
                    <div class="wordSelector">
                    </div>
                    <div class="transcript-header">
                        <button id="prev-btn" class="transcript-nav-btn">◀</button>
                        <div class="transcript-text">
                            <p id="japanese-line" class="jp">자막이 여기에 표시됩니다.</p>
                            <p id="korean-line" class="kr">구간을 선택해주세요.</p>
                        </div>
                        <button id="next-btn" class="transcript-nav-btn">▶</button>
                    </div>
                    <div id="transcript-index"></div>
                </div>


                <!-- 임시 말하기 기능 공간 -->
                <div class="card">
                    <input type="button" value="시작" id="startButton">
                    <input type="button" value="정지" id="stopButton">
                </div>

                <!-- 삭제/수정 임시 위치 -->
                <div class="card">
                    <button id="delete-button" class="delete-button">삭제하기</button>
                    <button id="edit-button" class="edit-button">수정하기</button>
                </div>
            </div>

            <!-- 우측 공간 - 구간 추가 관련 -->
            <div class="right-column sticky">
                <div class="card">
                    <div class="timeline-header">
                        <h3 class="card-title">학습 구간 목록</h3>
                        <span id="selected-section-display"></span>
                    </div>
                    <div id="timeline-buttons-container">
                        <!-- 섹션 버튼 생성 위치 -->
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
    // 임시 말하기 기능 자바스크립트
    const startButton = document.getElementById('startButton');
    const stopButton = document.getElementById('stopButton');

    let mediaRecorder;
    let audioChunks = [];

    startButton.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

            audioChunks = []; // 녹음 시작 시 배열 초기화

            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                console.log(audioBlob.size);
                // 서버로 음성 파일 전송
                const formData = new FormData();
                formData.append('audioFile', audioBlob, 'audio.wav'); // 파일 이름과 타입 지정
                formData.append('referenceText', '最近ついてないわって顔をしているそこのあなた。'); // 평가할 문장

                try {
                    const response = await fetch('http://localhost:5001/api/speech', {
                        method: 'POST',
                        body: formData,
                    });

                    if (response.ok) {
                        const result = await response.json();
                        console.log('Pronunciation Assessment Result:', result);
                        alert(`정확도: ${result.accuracyScore}, 유창성: ${result.fluencyScore}`);
                    } else {
                        console.error('Server error:', response.statusText);
                    }
                } catch (error) {
                    console.error('Network error:', error);
                }
            };

            mediaRecorder.start();
            startButton.disabled = true;
            stopButton.disabled = false;
            console.log("녹음 시작");

        } catch (err) {
            console.error("마이크 접근에 실패했습니다:", err);
        }
    });

    stopButton.addEventListener('click', () => {
        mediaRecorder.stop();
        startButton.disabled = false;
        stopButton.disabled = true;
        console.log("녹음 중지");
    });

    // 자막 전환, 기타등등 스크립트
    let globalClickListener = null;
    let isWordSelectorActive = false;

    document.addEventListener('DOMContentLoaded', ()=>{

        const langChange = document.getElementById('langChange');
        const jp = document.querySelector('.jp');

        jp.addEventListener('selectstart',()=>{
            jp.addEventListener('mouseup',(event)=>{
                const wordSel = window.getSelection().toString();
                textVal(wordSel,event);
                console.log('mouseup');
            });
            jp.addEventListener('mousemove',(e)=>{
                //console.log(e.clientX,e.clientY);
            });
        });

        langChange.onclick = function(){ langChangeFunction(); };

    });

    function langChangeFunction(){
        let langChange = document.getElementById('langChange');
        let jp = document.querySelector('.jp')
        let kr = document.querySelector('.kr');
        let now;  // 0: 둘 다, 1: 일본어만, 2: 한국어만

        if(!kr.classList.contains('hidden') && !jp.classList.contains('hidden')){
            now = 0;
        }else if(kr.classList.contains('hidden')){
            now = 1;
        } else {
            now = 2;
        }

        console.log(now + ':now' + ' change Language');
        // console.log(jp.innerHTML + ': jp ' + kr.innerHTML + ' : kr');

        if(now == 0){
            kr.classList.add('hidden');
            now = 1;
            langChange.innerHTML = ' 한 / <strong>일 </strong>';
        }else if(now == 1){
            jp.classList.add('hidden');
            kr.classList.remove('hidden');
            now = 2;
            langChange.innerHTML = '<strong> 한</strong> / 일 ';
        } else { // now == 2;
            jp.classList.remove('hidden');
            now = 0;
            langChange.innerHTML = '<strong> 한 + 일 </strong>';
        }

    }

    function textVal(wordSel, event) {
        const word = document.querySelector('.wordSelector');

        if (wordSel.length > 0) {
            // 이전 상태 정리
            clearGlobalClickListener();

            //단어 선택 후 저장하기 버튼
            word.innerHTML = wordSel +
                '<div><button class="saveBtn">저장하기</button></div>';

            word.classList.add('on');
            word.style.display = 'block';
            isWordSelectorActive = true;

            // Selection 객체를 사용하여 선택된 텍스트의 정확한 위치 가져오기
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                const range = selection.getRangeAt(0);
                const rect = range.getBoundingClientRect();

                // 선택된 텍스트의 중앙 위치 계산
                const posX = rect.left + window.scrollX + (rect.width / 2);
                const posY = rect.top + window.scrollY- 80;  // wordSelector가 위에 나타나도록

                // wordSelector를 중앙 정렬하기 위해 자신의 너비의 절반만큼 왼쪽으로 이동
                word.style.left = (posX - word.offsetWidth / 2) + 'px';
                word.style.top = (posY - 25) + 'px';

                console.log('selector position = ' + posX + ' : ' + posY);
            }

            // 충분한 지연 후 전역 클릭 이벤트 추가
            setTimeout(() => {
                if (isWordSelectorActive) {
                    addGlobalClickListener();
                }
            }, 300);

        } else {
            removeEvent();
        }
    }
    function addGlobalClickListener() {
        if (globalClickListener) return; // 이미 있으면 추가하지 않음

        globalClickListener = function(e) {
            const word = document.querySelector('.wordSelector');
            // wordSelector 영역이 아닌 곳을 클릭했을 때만 removeEvent 실행
            if (isWordSelectorActive && !word.contains(e.target)) {
                removeEvent();
            }
        };
        document.addEventListener('click', globalClickListener);
    }

    function clearGlobalClickListener() {
        if (globalClickListener) {
            document.removeEventListener('click', globalClickListener);
            globalClickListener = null;
        }
    }
    function removeEvent() {
        const word = document.querySelector('.wordSelector');

        word.classList.remove('on');
        word.style.display = 'none';
        isWordSelectorActive = false;

        // 선택 해제
        if (window.getSelection) {
            window.getSelection().removeAllRanges();
        }

        // 클릭 이벤트 제거
        clearGlobalClickListener();
    }
    // DOMContentLoaded에서 초기화
    document.addEventListener('DOMContentLoaded', () => {
        // 기존 코드...

        const jp = document.querySelector('.jp');
        let isSelecting = false;

        jp.addEventListener('mousedown', () => {
            isSelecting = true;
        });

        jp.addEventListener('mouseup', (event) => {
            if (isSelecting) {
                // 약간의 지연을 주어 selection이 완료되도록 함
                setTimeout(() => {
                    const wordSel = window.getSelection().toString().trim();
                    console.log(wordSel);
                    if (wordSel.length > 0) {
                        textVal(wordSel, event);
                    }
                    isSelecting = false;
                }, 50);
            }
        });

        // 페이지 로드시 wordSelector 숨김
        const word = document.querySelector('.wordSelector');
        if (word) {
            word.style.display = 'none';
        }
    });
</script>
</body>
<script th:src="@{/js/studyCard.js}"></script>
</html>
