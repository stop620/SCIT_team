<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MochiLearn - 퀴즈 풀기</title>
    <!-- 결과 원 그래프용 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:src="@{/js/quizForm.js}"></script>

    <link rel="stylesheet" th:href="@{/css/quizForm.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp.min.css" />

    <script th:src="@{/js/wordbook-popup.js}"></script>

</head>
<body>
<div th:replace="~{navigation::navigation}"></div>

<main>
    <div id="quiz-view" class="quiz-container">
        <h3 id="quiz-title"></h3>
        <div class="quiz-header">
            <div id="progress-text" class="progress-text"></div>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </div>
        <div id="korean-hint" class="korean-hint">퀴즈를 불러오는 중입니다...</div>
        <div id="quiz-area" class="quiz-area"></div>
        <div class="action-container">
            <button id="check-btn" class="action-btn">정답 확인</button>
            <button id="next-btn" class="action-btn">다음 문제</button>
        </div>
        <div id="feedback" class="feedback"></div>
    </div>

    <div id="result-view" class="result-container hidden">
        <div class="result-header">
            <h1>퀴즈 결과</h1>
            <p id="score-text"></p>
        </div>
        <div class="chart-container">
            <canvas id="result-chart"></canvas>
            <div id="chart-score"></div>
        </div>
        <div id="incorrect-notes" class="incorrect-notes">
            <h2>오답 노트</h2>
            <div id="incorrect-list"></div>
        </div>
        <div class="result-actions">
            <button id="retry-btn" class="action-btn">다시 풀기</button>
            <button id="exit-btn" class="action-btn">나가기</button>
        </div>
    </div>

</main>

</body>
</html>
