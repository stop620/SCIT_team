<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MochiLearn - 베스트&최신</title>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/bestPage.css}">

    <script th:src="@{/js/jquery-3.7.1.min.js}"></script>
    <script th:src="@{/js/bestPage.js}"></script>
    <script th:src="@{/js/wordbook-popup.js}"></script>
    <script th:src="@{/js/spinner.js}"></script>

</head>
<body>
<!-- 네비게이션 -->
<div th:replace="~{navigation::navigation}"></div>


<!-- Main Content Section -->
<main class="main-content container">
    <!-- Popular Videos Section -->
    <section>
        <h2 class="list_title">인기 학습 카드</h2>
        <div id="popularGrid" class="cardlist">
            <div class="loading-spinner"></div>
            <!-- 인기 카드 공간 -->
        </div>
    </section>

    <div class="divider"></div>

    <!-- Latest Videos Section -->
    <section>
        <h2 class="list_title">최신 학습 카드</h2>
        <div id="latestGrid" class="cardlist">
            <div class="loading-spinner"></div>
            <!-- 최신 카드 공간 -->
        </div>
    </section>
</main>

<!-- Footer -->
<div th:replace="~{footer::footer}"></div>

</body>
</html>
