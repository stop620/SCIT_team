<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MochiLearn - 학습하기</title>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>

        /* Main Content Section */
        .main-content {
            padding-top: 2rem;
            padding-bottom: 4rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--mochi-gray-dark);
            text-align: center;
            margin-bottom: 2rem;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .video-card {
            background-color: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .video-thumbnail {
            width: 100%;
            height: 150px;
            background-color: var(--mochi-gray-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--mochi-gray-dark);
            position: relative;
        }

        .play-icon {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--mochi-blue);
        }

        .video-info {
            padding: 1rem;
        }

        .video-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        /* Container for difficulty and likes */
        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.25rem;
        }

        /* Styles for difficulty tags */
        .difficulty-tag {
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem; /* Slightly rounded */
            color: white;
        }
        .difficulty-tag.beginner {
            background-color: var(--mochi-level-beginner);
        }
        .difficulty-tag.intermediate {
            background-color: var(--mochi-level-intermediate);
        }
        .difficulty-tag.advanced {
            background-color: var(--mochi-level-advanced);
        }

        /* Styles for likes */
        .video-stats {
            display: flex;
            align-items: center;
            font-size: 0.875rem;
            color: var(--mochi-gray-dark);
        }
        .video-stats .star {
            color: var(--mochi-pink);
            margin-right: 5px;
        }

        /* Container for genre/other tags */
        .tag-container {
            margin-top: 1rem;
            padding-top: 0.5rem;
            border-top: 1px solid var(--mochi-gray-light);
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .genre-tag-item {
            background-color: var(--mochi-gray-light);
            color: var(--mochi-gray-dark);
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .divider {
            height: 1px;
            background-color: #ddd;
            width: 50%;
            margin: 2rem auto;
        }

        /* Responsive Design */
        @media (min-width: 768px) {
            .nav-links {
                display: flex;
            }

            .mobile-menu-btn {
                display: none;
            }
        }
    </style>
</head>
