<!doctype html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MochiLearn</title>

    <!-- 기존 CSS 파일 -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/write.css}">
    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script th:src="@{/js/write.js}"></script>

</head>

<body>
<div th:replace="~{navigation::navigation}"></div>

<main>
    <div class="main-grid">

        <!-- 왼쪽부분 영상, 자막 -->
        <div class="left-column">
            <!-- 제목 -->
            <div>
                <input id="title-input"
                       type="text"
                       class="input-field title-input"
                       placeholder="학습 카드 제목을 입력하세요잉"/>
            </div>

            <!-- Player -->
            <div id="player-container" class="player-container hidden">
                <div id="player"></div>
            </div>

            <!-- URL Input -->
            <div>
                <input
                        id="url-input"
                        type="text"
                        class="input-field"
                        placeholder="학습할 YouTube 영상 URL을 입력하세요."
                />
            </div>

            <!-- Transcript Display -->
            <div id="transcript-container" class="card transcript-container hidden">
                <div class="transcript-header">
                    <button id="prev-btn" class="transcript-nav-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    </button>
                    <div class="transcript-text">
                        <p id="japanese-line">자막이 여기에 표시됩니다.</p>
                        <p id="korean-line">구간을 추가하고 버튼을 눌러주세요.</p>
                    </div>
                    <button id="next-btn" class="transcript-nav-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </div>
                <div id="transcript-index"></div>
            </div>

            <!-- Tag Selection -->
            <div class="card tag-section">
                <div>
                    <h4 class="tag-title">난이도</h4>
                    <div id="difficulty-tags" class="tag-group">
                        <button class="tag-button">초급</button>
                        <button class="tag-button">중급</button>
                        <button class="tag-button">고급</button>
                    </div>
                </div>
                <div>
                    <h4 class="tag-title">장르</h4>
                    <div id="genre-tags" class="tag-group">
                        <button class="tag-button">드라마</button>
                        <button class="tag-button">애니</button>
                        <button class="tag-button">영화</button>
                        <button class="tag-button">일상회화</button>
                        <button class="tag-button">비즈니스</button>
                    </div>
                </div>
            </div>

            <!-- Save Button -->
            <div>
                <button id="save-card-btn" class="button">
                    학습 카드 저장하기
                </button>
            </div>

        </div>

        <!-- Right Column: Controls & Timelines -->
        <div class="right-column">
            <div class="card">
                <h3 class="card-title">학습 구간 추가</h3>
                <div class="time-input-group">
                    <input
                            id="start-input"
                            type="text"
                            class="time-input"
                            placeholder="00:00"
                    />
                    <span>-</span>
                    <input
                            id="end-input"
                            type="text"
                            class="time-input"
                            placeholder="00:10"
                    />
                </div>
                <button id="add-timeline-btn" class="button">
                    <span>구간 추가</span>
                </button>
            </div>

            <div class="card">
                <div class="timeline-header">
                    <h3 class="card-title">학습 구간 목록</h3>
                    <span id="selected-section-display"></span>
                </div>
                <div id="timeline-buttons-container">
                    <!-- Circular timeline buttons will be added here -->
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
