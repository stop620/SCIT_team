<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>study</title>
    <link rel="stylesheet" th:href="@{/css/nav.css}" />
    <style>
        /* 간단한 카드 스타일 */
        #cardGrid {
		    display: grid;
		    grid-template-columns: repeat(4, 220px);
		    justify-content: center;       /* 전체 카드를 컨테이너 중앙에 배치 */
		    gap: 30px  /* 행과 열 간격 */;
		    padding: 20px;
		    max-width: calc(220px * 4 + 30px * 3 + 40px);
		    margin: 0 auto;
		}
		
		.card {
		    flex: 0 0 220px;               /* 너비 220px 고정 */
		    max-width: 220px;
		    border: 1px solid #ddd;
		    border-radius: 8px;
		    box-shadow: 1px 1px 6px rgba(0, 0, 0, 0.1);
		    cursor: pointer;
		    overflow: hidden;
		    background: #fff;
		    text-align: center;
		    transition: box-shadow 0.3s ease;
		    margin-bottom: 20px;           /* 카드를 감싸는 행 간격 */
		}
        .card:hover {
            box-shadow: 3px 3px 12px rgba(0, 0, 0, 0.2);
        }
        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .card h3 {
            margin: 10px 0 6px;
            font-size: 1.1em;
            color: #333;
        }
        .card p {
            margin: 0 10px 10px;
            font-size: 0.95em;
            color: #666;
            
        }
        #searchContainer {
	    display: flex;
	    justify-content: center;  /* 가로 중앙 정렬 */
	    align-items: center;      /* 세로 중앙 정렬(옵션) */
	    margin-bottom: 16px;      /* 아래 여백 */
	    width: 100%;
	}
    </style>
</head>
<body>
	    <div th:replace="~{navigation::navigation}"></div>
		<div id="searchContainer" style="margin-bottom: 16px;">
	    	<input type="text" id="searchInput" style="width: 220px;">
	    	<button id="searchBtn">검색</button>
		</div>
	    <label for="sortBox">정렬 기준:</label>
	    <select id="sortBox" name="sortBox">
	        <option value="popular">인기순</option>
	        <option value="latest">최신순</option>
	    </select>
	
	    <div id="cardGrid" th:fragment="cards">
	        <div th:each="card : ${cards}" 
	             class="card" 
				 >
				<h3 th:text="${card.title}">제목</h3>
				<img th:src="${card.url} ?: @{/images/default-thumbnail.png}" alt="썸네일 이미지" />
	            
	        </div>
	    </div>
	    <button id="scrollTopBtn" style="
		    position: fixed;
		    bottom: 30px;
		    right: 30px;
		    display: none;
		    padding: 10px 15px;
		    font-size: 14px;
		    border: none;
		    border-radius: 6px;
		    background-color: #333;
		    color: white;
		    cursor: pointer;
		    z-index: 1000;
		">▲ 위로가기</button>
	
	
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script>
	function getYoutubeThumbnail(youtubeUrl) {
	    let videoId = '';
	    if (!youtubeUrl) {
	        return '/images/default-thumbnail.png';  // URL이 없으면 기본 이미지 반환
	    }

	    if (youtubeUrl.includes('youtu.be/')) {
	        videoId = youtubeUrl.split('youtu.be/')[1].split(/[?&]/)[0];
	    } else if (youtubeUrl.includes('v=')) {
	        videoId = youtubeUrl.split('v=')[1].split(/[?&]/)[0];
	    }
	    if (videoId) {
	        return `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
	    }

	    return '/images/default-thumbnail.png';
	}

	let page = 0;
	const size = 12;
	let sort = 'popular';
	let loading = false;
	let endReached = false;

	function renderCards(cards, reset = false) {
	    if (reset) {
	        $('#cardGrid').empty(); // 정렬 변경 시 기존 목록 제거
	    }

	    cards.forEach(card => {
	        const thumbUrl = getYoutubeThumbnail(card.url);
	        const cardHtml = `
	            <div class="card" onclick="location.href='/mochilearn/page/studyCard?cardId=${card.cardId}'">
	                <h3>${card.title}</h3>
	                <img src="${thumbUrl}" alt="썸네일 이미지" />
	            </div>
	        `;
	        $('#cardGrid').append(cardHtml);
	    });
	}

	function loadCards(reset = false) {
	    if (reset) {
	        page = 0;
	        endReached = false;
	    }

	    if (loading || endReached) return;

	    loading = true;

	    $.get('/mochilearn/api/study/cards', {
	            sort: sort,
	            page: page,
	            size: size,
	            search: search // 검색어 파라미터 추가
	        })
	        .done(function(data) {
	            if (!data || data.length === 0) {
	                endReached = true;
	                return;
	            }
	            if (reset) $('#cardGrid').empty();
	            renderCards(data, reset);
	            page++;
	        })
	        .fail(function(jqXHR, textStatus, errorThrown) {
	            console.error("AJAX 요청 실패:", textStatus, errorThrown);
	        })
	        .always(function() {
	            loading = false;
	        });
	}

	$(document).ready(function() {
	    // 초기 로드
	    loadCards(true);

	    // 정렬 변경
	    $('#sortBox').change(function() {
	        console.log("드롭다운 변경 이벤트 발생!");
	        sort = $(this).val();
	        loadCards(true);
	    });

	    // 검색 버튼 클릭 시
	    $('#searchBtn').on('click', function() {
	        search = $('#searchInput').val().trim(); // 검색어 상태 업데이트
	        loadCards(true); // 검색할 때는 항상 카드 초기화
	    });

	    // 엔터키로도 검색 가능하게
	    $('#searchInput').on('keydown', function(e) {
	        if (e.key === 'Enter') {
	            search = $(this).val().trim();
	            loadCards(true);
	        }
	    });

	    // 스크롤로 다음 페이지 로드
	    $(window).scroll(function() {
	        if ($(window).scrollTop() + $(window).height() > $(document).height() - 100) {
	            loadCards(false);
	        }
	    });

	    // 위로가기 버튼 보이게 하기
	    $(window).on('scroll', function() {
	        if ($(window).scrollTop() > 200) {
	            $('#scrollTopBtn').fadeIn();
	        } else {
	            $('#scrollTopBtn').fadeOut();
	        }
	    });

	    // 버튼 클릭 시 부드럽게 위로 스크롤
	    $('#scrollTopBtn').on('click', function() {
	        $('html, body').animate({ scrollTop: 0 }, 500); // 0.5초간 부드럽게 스크롤업
	    });
	});

		    let search = ""; // 검색어 변수 추가
	
	    function loadCards(reset = false) {
	        if (reset) {
	            page = 0;
	            endReached = false;
	        }
	
	        if (loading || endReached) return;
	
	        loading = true;
	
	        $.get('/mochilearn/api/study/cards', { 
	                sort: sort, 
	                page: page, 
	                size: size, 
	                search: search // 검색어 파라미터 추가 
	            })
	            .done(function(data) {
	                if (!data || data.length === 0) {
	                    endReached = true;
	                    return;
	                }
	                if (reset) $('#cardGrid').empty();
	                renderCards(data, reset);
	                page++;
	            })
	            .fail(function(jqXHR, textStatus, errorThrown) {
	                console.error("AJAX 요청 실패:", textStatus, errorThrown);
	            })
	            .always(function() { loading = false; });
	    }

	    // 검색 버튼 클릭 시
	    $('#searchBtn').on('click', function() {
	        search = $('#searchInput').val().trim(); // 검색어 상태 업데이트
	        loadCards(true); // 검색할 때는 항상 카드 초기화
	    });
	
	    // 엔터키로도 검색 가능하게
	    $('#searchInput').on('keydown', function(e) {
	        if (e.key === 'Enter') {
	            search = $(this).val().trim();
	            loadCards(true);
	        }
	    });
	    
	 
    </script>
</body>
</html>
