<!DOCTYPE html>
<html lang="en" xmlns:th="thymeleaf.org">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp.min.css" />
<head>
<meta charset="UTF-8" />
<title>study</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/studyPage.css}">
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script th:src="@{/js/studyPage.js}" async></script>
</head>
<body>

<div th:replace="~{navigation::navigation}"></div>

<div id="searchContainer" style="margin-bottom: 16px;">
    	<input type="text" id="searchInput" style="width: 220px;">
    	<button id="searchBtn">검색</button>
	</div>
	<div id="addCard">
		<a th:href="@{/page/write}">
			<button id="addCardBtn">학습카드 추가하기</button>
		</a>
	</div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0;">
    <!-- 왼쪽: 태그 버튼 -->
    <button type="button" id="tagBtn">태그버튼</button>
	<!-- 모달 -->
	    <div id="tagModal">
	        <div class="modal-content">
	            <span class="close-btn">&times;</span>
	            <h3>태그선택</h3>
	            <div id="tagList">
	                <div class="tagSelect" data-value="드라마">드라마</div>
	                <div class="tagSelect" data-value="애니">애니메이션</div>
	                <div class="tagSelect" data-value="영화">영화</div>
	                <div class="tagSelect" data-value="일상회화">일상회화</div>
	                <div class="tagSelect" data-value="비즈니스">비즈니스</div>
	            </div>
	            <button id="applyTagFilter">필터적용</button>
	        </div>
	    </div>

    <!-- 오른쪽: 정렬 기준 -->
    <div style="margin-right: 50px;">
        <label for="sortBox" style="margin-right: 8px; font-weight: bold;">정렬 기준:</label>
        <select id="sortBox" name="sortBox" style="padding: 6px 12px; font-size: 14px;">
            <option value="popular">인기순</option>
            <option value="latest">최신순</option>
        </select>
    </div>
</div>
    <div id="cardGrid" th:fragment="cards">
        <div th:each="card : ${cards}" 
             class="card">
			<h3 th:text="${card.title}">제목</h3>
			<img th:src="${card.url} ?: @{/images/default-thumbnail.png}" alt="썸네일 이미지" />
        </div>
    </div>
    <button id="scrollTopBtn" style="position: fixed;
								    bottom: 30px;
								    right: 30px;
								    padding: 10px 15px;
								    font-size: 14px;
								    border: none;
								    border-radius: 6px;
								    background-color: #333;
								    color: white;
								    cursor: pointer;
								    z-index: 1000;">위로가기</button>

	
	
</body>
</html>
