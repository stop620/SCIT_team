spring.application.name=MochiLearn

# url
server.port=9000
server.servlet.context-path=/mochilearn

# log
logging.level.root=info
logging.level.com.hanzo.mochilearn=debug
logging.level.org.springframework.security=DEBUG

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://34.64.135.30:3306/hanzo
spring.datasource.username=admin
spring.datasource.password=qwer1234

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=trace

# transcribe server url
transcribe.server.url=http://localhost:5001