plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hanzo'
version = '0.0.1-SNAPSHOT'
description = 'Transcribe-Server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Google Gson for parsing JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // jave
    implementation 'ws.schild:jave-core:3.5.0'
    implementation 'ws.schild:jave-nativebin-win64:3.5.0'

    // google ai
    implementation 'com.google.genai:google-genai:1.13.0'

    // azure ai
    implementation group: 'com.microsoft.cognitiveservices.speech', name: 'client-sdk', version: "1.43.0", ext: "jar"
    implementation "io.github.java-diff-utils:java-diff-utils:4.12"
    implementation 'org.glassfish:javax.json:1.1.4'
}

tasks.named('test') {
    useJUnitPlatform()
}
